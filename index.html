<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Consent Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Cookie Consent</h1>
        <p>We use cookies to improve your browsing experience.</p>
        <button id="reset-btn" class="reset-btn">Reset Consent</button>
    </main>

    <div id="cookie-overlay" class="cookie-overlay hidden"></div>

    <div id="cookie-popup" class="cookie-popup hidden">
        <div class="cookie-emoji">🍪</div>
        <h2>We use cookies</h2>
        <p>This website uses cookies to improve your browsing experience.</p>
        <button id="accept-btn" class="accept-btn">Accept Cookies</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
